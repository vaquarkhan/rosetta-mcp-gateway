[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-mcp"
version = "0.1.0"
description = "Schema-aware multilingual MCP translation gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rosetta-mcp = "rosetta.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
