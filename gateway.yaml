# Pivot Mode: English schemas, arguments translated to English, prose results
# translated back to the caller locale.
schema_translation_mode: none

translation:
  # balanced: DeepL for its European set, Google Cloud v3 for the long
  # tail, CTranslate2 Opus-MT when model_dir is set, then the dev fallback.
  # airgap uses only model_dir. quality uses only DeepL and Google Cloud.
  # dev uses only the fallback.
  profile: balanced
  fallback: mymemory
  target: en
  model_dir: ""
  device: cpu

upstream:
  name: upstream
  url: http://127.0.0.1:9100/mcp
  # 2026-07-28 is stateless. Set 2025-11-25 to perform initialize
  # and attach Mcp-Session-Id before forwarding.
  protocol: "2026-07-28"

server:
  host: 127.0.0.1
  port: 8080

# Optional. Requires a separate install of mcp-bastion-python and acceptance
# of that project's license. Off by default. ROSETTA_BASTION=1 turns it on.
security:
  bastion: false

# Leaf property names that are shared domain terms, not free text.
entity_locked_fields: []

# Literal strings masked inside a translatable value before Phase 2.
glossary: []

# Per-tool dotted-path overrides. Operator assignment wins over heuristics.
# tools:
#   search_invoices:
#     fields:
#       query: TYPE_FREE_TEXT
#       cluster: TYPE_ENTITY_LOCKED
tools: {}
